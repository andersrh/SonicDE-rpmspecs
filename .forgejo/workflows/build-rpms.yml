name: Build RPMs

on:
  push:
    paths:
      - "**.spec"
      - "build-order.txt"
      - "ci/**"
      - ".forgejo/workflows/build-rpms.yml"
  pull_request:
  workflow_dispatch:

env:
  FORGEJO_URL: ${{ github.server_url }}
  FORGEJO_OWNER: ${{ github.repository_owner }}
  FORGEJO_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

jobs:
  parse:
    runs-on: almalinux-10
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:10
          - fedora:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: dnf install -y rpm-build rpmdevtools git-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the SonicDE RPM macros
        run: ci/install-macros.sh

      - name: Parse every spec
        run: ci/parse-specs.sh

  tier1:
    runs-on: almalinux-10
    needs: [parse]
    strategy:
      fail-fast: false
      matrix:
        chroot:
          - alma+epel-10-x86_64
          - fedora-43-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y rpm-build rpmdevtools mock curl

      - name: Add runner user to mock group
        run: usermod -aG mock $(whoami) || true

      - name: Install the SonicDE RPM macros
        run: ci/install-macros.sh

      - name: Build tier1 for ${{ matrix.chroot }}
        run: ci/build-tier.sh tier1 ${{ matrix.chroot }}

      - name: Clean up build artifacts
        if: always()
        run: rm -rf "${HOME}/mock-results" "${HOME}/rpmbuild/SRPMS"

